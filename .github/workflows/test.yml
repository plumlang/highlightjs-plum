# Markup tests and the dist/ check, run with highlight.js's own build tool
# and test runner, as its 3rd-party grammar guide describes.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to catch a keyword added to Plumlang's lexer since the last push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: highlightjs/highlight.js
      - uses: actions/checkout@v4
        with:
          path: extra/highlightjs-plum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: plumlang/setup-plum@v1
      - run: npm ci
      - name: Markup tests
        run: |
          node tools/build.js -t node plum
          ONLY_EXTRA=true npx mocha test/markup
      # plumlang's tests/highlight/ from main: every keyword, and every token
      # of sample.plum as `plum tokens` reads it.
      - name: Shared highlighting sample
        run: node extra/highlightjs-plum/test/sample.cjs
      - name: dist/ is up to date
        run: |
          node tools/build.js -t cdn plum
          git -C extra/highlightjs-plum diff --exit-code -I '^/\*! `plum` grammar compiled for Highlight.js' dist/
